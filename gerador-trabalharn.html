*{box-sizing:border-box}
body{margin:0;background:#F2F5F3;color:#12321F;font:400 15px/1.5 Poppins,system-ui,Arial,sans-serif}
header{background:#009B3A;color:#fff;padding:18px 24px;display:flex;align-items:center;gap:14px}
header canvas{width:46px;height:46px}
header b{font-weight:700;font-size:22px;letter-spacing:-.3px}
header b i{color:#FEDF00;font-style:normal}
header span{margin-left:auto;font-size:13px;opacity:.85}
main{max-width:1240px;margin:22px auto;padding:0 20px;display:grid;grid-template-columns:minmax(320px,1fr) minmax(320px,1.05fr);gap:22px;align-items:start}
.panel{background:#fff;border-radius:16px;padding:22px;box-shadow:0 1px 3px rgba(10,50,25,.10)}
h2{margin:0 0 16px;font-size:15px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#009B3A}
label{display:block;margin-bottom:13px;font-size:12.5px;font-weight:700;letter-spacing:.4px;color:#5C6B62;text-transform:uppercase}
input,textarea,select{width:100%;margin-top:6px;padding:11px 13px;border:1.5px solid #DFE7E2;border-radius:10px;
  font:400 15px/1.4 Poppins,system-ui,Arial,sans-serif;color:#12321F;background:#fff;text-transform:none;letter-spacing:0}
input:focus,textarea:focus,select:focus{outline:none;border-color:#2498DC;box-shadow:0 0 0 3px rgba(36,152,220,.15)}
textarea{resize:vertical;min-height:92px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.hint{font-weight:400;text-transform:none;letter-spacing:0;color:#8A9A91;font-size:12px}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tabs button{flex:1;padding:10px;border:1.5px solid #DFE7E2;background:#fff;border-radius:10px;cursor:pointer;
  font:700 13px Poppins,sans-serif;color:#5C6B62}
.tabs button[aria-selected=true]{background:#009B3A;border-color:#009B3A;color:#fff}
.stage{background:#EDF2EF;border-radius:12px;padding:14px;display:flex;justify-content:center}
canvas.prev{max-width:100%;max-height:62vh;height:auto;border-radius:8px;box-shadow:0 2px 10px rgba(10,50,25,.15)}
.row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{flex:1;min-width:150px;padding:13px 16px;border:0;border-radius:11px;cursor:pointer;
  font:700 14px Poppins,sans-serif;background:#009B3A;color:#fff}
.btn.alt{background:#2498DC}
.btn.ghost{background:#FEDF00;color:#12321F}
.btn:active{transform:translateY(1px)}
footer{max-width:1240px;margin:0 auto 40px;padding:0 20px;color:#7B8B82;font-size:13px}
@media(max-width:900px){main{grid-template-columns:1fr}}
</style>
</head>
<body>

<header>
  <canvas id="logo" width="140" height="140"></canvas>
  <b>Trabalha<i>RN</i></b>
  <span>Gerador de posts &middot; 1080&times;1350 e 1080&times;1920</span>
</header>

<main>
  <section class="panel">
    <h2>Dados da vaga</h2>
    <label>Cargo <span class="hint">(aparece em destaque)</span>
      <input id="cargo" value="Auxiliar Administrativo"></label>
    <label>Empresa <span class="hint">(opcional)</span>
      <input id="empresa" value="Supermercado Nordestão"></label>
    <div class="grid2">
      <label>Cidade<input id="cidade" value="Natal / RN"></label>
      <label>Contrato
        <input id="contrato" list="tipos" value="CLT">
        <datalist id="tipos"><option>CLT</option><option>Estágio</option><option>PJ</option>
        <option>Temporário</option><option>Jovem Aprendiz</option><option>Freelancer</option><option>Trainee</option></datalist>
      </label>
      <label>Salário<input id="salario" value="R$ 1.800 + benefícios"></label>
      <label>Horário <span class="hint">(opcional)</span><input id="horario" value="Seg a sex, 8h às 17h"></label>
    </div>
    <label>Quantidade de vagas<input id="vagas" type="number" min="1" value="3"></label>
    <label>Requisitos <span class="hint">— um por linha, até 5</span>
      <textarea id="requisitos">Ensino médio completo
Experiência mínima de 6 meses na área
Pacote Office intermediário</textarea></label>
    <label>Como se candidatar
      <input id="candidatura" value="Envie o currículo para vagas@empresa.com.br"></label>
    <label>Rodapé do story <span class="hint">(só aparece no story)</span>
      <input id="rodape" value="Siga @trabalharn e veja vagas todos os dias"></label>

    <h2 style="margin-top:26px">Legenda pronta</h2>
    <textarea id="legenda" rows="9" readonly></textarea>
    <div class="row"><button class="btn ghost" id="copiar">Copiar legenda</button></div>
  </section>

  <section class="panel">
    <h2>Prévia</h2>
    <div class="tabs">
      <button id="tabPost" aria-selected="true">Post 1080&times;1350</button>
      <button id="tabStory" aria-selected="false">Story 1080&times;1920</button>
    </div>
    <div class="stage">
      <canvas id="cPost" class="prev" width="1080" height="1350"></canvas>
      <canvas id="cStory" class="prev" width="1080" height="1920" style="display:none"></canvas>
    </div>
    <div class="row">
      <button class="btn" id="dlPost">Baixar post</button>
      <button class="btn alt" id="dlStory">Baixar story</button>
      <button class="btn ghost" id="dlAmbos">Baixar os dois</button>
    </div>
  </section>
</main>

<footer>Os arquivos saem em PNG no tamanho exato para o feed e para os stories. Nada é enviado para a internet — tudo é gerado no seu próprio aparelho.</footer>

<script>
/* TrabalhaRN — motor de desenho (post 1080x1350 e story 1080x1920)
   Usa apenas Canvas 2D, roda no navegador e no Node (node-canvas). */
(function (global) {
  var C = {
    green: '#009B3A', white: '#ffffff', yellow: '#FEDF00', blue: '#2498DC',
    ink: '#0E3B23', mute: '#6C7C72', line: '#E6EDE8', tint: 'rgba(36,152,220,0.12)'
  };
  var FAM = 'Poppins, "Trebuchet MS", Arial, sans-serif';
  function font(w, s) { return w + ' ' + s + 'px ' + FAM; }
  var TAU = Math.PI * 2;

  /* ---------- utilitários ---------- */
  function rr(ctx, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function trackedWidth(ctx, t, sp) {
    var w = 0;
    for (var i = 0; i < t.length; i++) { w += ctx.measureText(t[i]).width + sp; }
    return w - (t.length ? sp : 0);
  }
  function drawTracked(ctx, t, x, y, sp) {
    for (var i = 0; i < t.length; i++) {
      ctx.fillText(t[i], x, y);
      x += ctx.measureText(t[i]).width + sp;
    }
  }
  function wrap(ctx, text, maxW) {
    var words = String(text).split(/\s+/).filter(Boolean), lines = [], cur = '';
    for (var i = 0; i < words.length; i++) {
      var t = cur ? cur + ' ' + words[i] : words[i];
      if (ctx.measureText(t).width <= maxW || !cur) { cur = t; }
      else { lines.push(cur); cur = words[i]; }
    }
    if (cur) lines.push(cur);
    return lines;
  }
  function fit(ctx, text, maxW, maxLines, weight, from, min) {
    for (var s = from; s >= min; s -= 2) {
      ctx.font = font(weight, s);
      var l = wrap(ctx, text, maxW);
      if (l.length <= maxLines) return { size: s, lines: l };
    }
    ctx.font = font(weight, min);
    var lines = wrap(ctx, text, maxW).slice(0, maxLines);
    var last = lines[maxLines - 1] || '';
    while (last.length > 3 && ctx.measureText(last + '…').width > maxW) last = last.slice(0, -1);
    if (lines.length) lines[lines.length - 1] = last + '…';
    return { size: min, lines: lines };
  }
  function clip1(ctx, text, maxW) {
    text = String(text);
    if (ctx.measureText(text).width <= maxW) return text;
    while (text.length > 1 && ctx.measureText(text + '…').width > maxW) text = text.slice(0, -1);
    return text + '…';
  }

  /* ---------- emblema (sol + maleta + dunas) ---------- */
  function mark(ctx, cx, cy, r, semDisco) {
    var k = r / 290;
    ctx.save();
    ctx.translate(cx - 300 * k, cy - 300 * k);
    ctx.scale(k, k);

    if (!semDisco) {
      ctx.fillStyle = C.white;
      ctx.beginPath(); ctx.arc(300, 300, 290, 0, TAU); ctx.fill();
    }

    ctx.save();
    ctx.beginPath(); ctx.arc(300, 300, 290, 0, TAU); ctx.clip();

    ctx.strokeStyle = C.yellow; ctx.lineWidth = 17; ctx.lineCap = 'round';
    [-150, -120, -90, -60, -30].forEach(function (a) {
      var t = a * Math.PI / 180;
      ctx.beginPath();
      ctx.moveTo(300 + 138 * Math.cos(t), 186 + 138 * Math.sin(t));
      ctx.lineTo(300 + 171 * Math.cos(t), 186 + 171 * Math.sin(t));
      ctx.stroke();
    });
    ctx.fillStyle = C.yellow;
    ctx.beginPath(); ctx.arc(300, 186, 118, 0, TAU); ctx.fill();

    ctx.fillStyle = C.blue;
    ctx.beginPath();
    ctx.moveTo(0, 474);
    ctx.bezierCurveTo(70, 442, 142, 444, 212, 468);
    ctx.bezierCurveTo(292, 495, 362, 444, 452, 453);
    ctx.bezierCurveTo(522, 460, 572, 481, 600, 472);
    ctx.lineTo(600, 600); ctx.lineTo(0, 600); ctx.closePath(); ctx.fill();

    ctx.fillStyle = C.yellow;
    ctx.beginPath();
    ctx.moveTo(0, 520);
    ctx.bezierCurveTo(92, 476, 162, 538, 252, 522);
    ctx.bezierCurveTo(342, 506, 402, 542, 472, 516);
    ctx.bezierCurveTo(532, 494, 572, 516, 600, 507);
    ctx.lineTo(600, 600); ctx.lineTo(0, 600); ctx.closePath(); ctx.fill();

    ctx.strokeStyle = C.blue; ctx.lineWidth = 26; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(253, 266); ctx.lineTo(253, 234);
    ctx.arcTo(253, 210, 277, 210, 24);
    ctx.lineTo(323, 210);
    ctx.arcTo(347, 210, 347, 234, 24);
    ctx.lineTo(347, 266);
    ctx.stroke();

    ctx.fillStyle = C.blue; rr(ctx, 158, 260, 284, 192, 30); ctx.fill();
    ctx.fillStyle = C.white; ctx.fillRect(158, 328, 284, 27);
    ctx.fillStyle = C.yellow; rr(ctx, 272, 316, 56, 51, 13); ctx.fill();

    ctx.restore();
    ctx.restore();
  }

  /* ---------- faixas de duna/mar no rodapé ---------- */
  function waves(ctx, W, H, top) {
    ctx.fillStyle = C.blue;
    ctx.beginPath();
    ctx.moveTo(0, top + 45);
    ctx.bezierCurveTo(W * 0.17, top + 8, W * 0.35, top + 18, W * 0.52, top + 48);

    ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();

    ctx.fillStyle = C.yellow;
    ctx.beginPath();
    ctx.moveTo(0, top + 108);
    ctx.bezierCurveTo(W * 0.20, top + 60, W * 0.41, top + 130, W * 0.62, top + 112);
    ctx.bezierCurveTo(W * 0.81, top + 96, W * 0.90, top + 136, W, top + 118);
    ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();
  }

  /* ---------- ícones ---------- */
  function iconPin(ctx, cx, cy, s) {
    ctx.fillStyle = C.blue;
    ctx.beginPath(); ctx.arc(cx, cy - s * 0.12, s * 0.40, 0, TAU); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx - s * 0.24, cy + s * 0.10);
    ctx.lineTo(cx + s * 0.24, cy + s * 0.10);
    ctx.lineTo(cx, cy + s * 0.62); ctx.closePath(); ctx.fill();
    ctx.fillStyle = C.white;
    ctx.beginPath(); ctx.arc(cx, cy - s * 0.12, s * 0.15, 0, TAU); ctx.fill();
  }
  function iconMoney(ctx, cx, cy, s) {
    ctx.fillStyle = C.blue;
    rr(ctx, cx - s * 0.5, cy - s * 0.33, s, s * 0.66, s * 0.12); ctx.fill();
    ctx.fillStyle = C.white;
    ctx.beginPath(); ctx.arc(cx, cy, s * 0.17, 0, TAU); ctx.fill();
    ctx.fillRect(cx - s * 0.42, cy - s * 0.25, s * 0.06, s * 0.5);
    ctx.fillRect(cx + s * 0.36, cy - s * 0.25, s * 0.06, s * 0.5);
  }
  function iconCase(ctx, cx, cy, s) {
    ctx.strokeStyle = C.blue; ctx.lineWidth = s * 0.13; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx - s * 0.19, cy - s * 0.26);
    ctx.lineTo(cx - s * 0.19, cy - s * 0.38);
    ctx.lineTo(cx + s * 0.19, cy - s * 0.38);
    ctx.lineTo(cx + s * 0.19, cy - s * 0.26);
    ctx.stroke();
    ctx.fillStyle = C.blue;
    rr(ctx, cx - s * 0.48, cy - s * 0.24, s * 0.96, s * 0.62, s * 0.12); ctx.fill();
    ctx.fillStyle = C.white;
    ctx.fillRect(cx - s * 0.48, cy - s * 0.02, s * 0.96, s * 0.08);
  }
  function iconClock(ctx, cx, cy, s) {
    ctx.fillStyle = C.blue;
    ctx.beginPath(); ctx.arc(cx, cy, s * 0.45, 0, TAU); ctx.fill();
    ctx.strokeStyle = C.white; ctx.lineWidth = s * 0.09; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(cx, cy - s * 0.24); ctx.lineTo(cx, cy);
    ctx.lineTo(cx + s * 0.17, cy + s * 0.08); ctx.stroke();
  }
  var ICONS = { pin: iconPin, money: iconMoney, case: iconCase, clock: iconClock };

  /* ---------- logotipo horizontal ---------- */
  function lockup(ctx, cx, baseY, size, markR, centered) {
    ctx.font = font(700, size);
    var w1 = ctx.measureText('Trabalha').width, w2 = ctx.measureText('RN').width;
    var gap = markR * 0.55, total = markR * 2 + gap + w1 + w2;
    var x = centered ? cx - total / 2 : cx;
    mark(ctx, x + markR, baseY - size * 0.36, markR);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = C.white; ctx.fillText('Trabalha', x + markR * 2 + gap, baseY);
    ctx.fillStyle = C.yellow; ctx.fillText('RN', x + markR * 2 + gap + w1, baseY);
  }

  /* ---------- desenho principal ---------- */
  function draw(ctx, d, fmt) {
    d = d || {};
    var story = fmt === 'story';
    var W = 1080, H = story ? 1920 : 1350;
    var cardT = story ? 560 : 168;
    var cardB = story ? 1626 : 1204;
    var L = 120, CW = 840;

    ctx.save();
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = C.green; ctx.fillRect(0, 0, W, H);

    ctx.globalAlpha = 0.07; ctx.fillStyle = C.white;
    ctx.beginPath(); ctx.arc(W + 40, story ? 250 : 110, 260, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;

    waves(ctx, W, H, story ? H - 190 : H - 140);

    if (story) lockup(ctx, 540, 400, 66, 88, true);
    else lockup(ctx, 76, 118, 50, 56, false);

    ctx.fillStyle = C.white;
    rr(ctx, 56, cardT, 968, cardB - cardT, 46); ctx.fill();

    /* ----- barra de candidatura (ancorada no rodapé do cartão) ----- */
    var cta = fit(ctx, d.candidatura || 'Envie seu currículo pela nossa página',
      CW - 4, 2, 700, 36, 23);
    var barH = Math.round(84 + (cta.lines.length - 1) * (cta.size + 8) + cta.size * 0.30 + 26);
    var barY = cardB - 42 - barH;
    var top = cardT + 48, avail = barY - 24 - top;

    /* ----- monta os blocos ----- */
    var items = [];   /* {h, w(peso do espaço antes), f(render)} */

    var pills = [];
    var n = parseInt(d.vagas, 10);
    pills.push({ t: (n > 1 ? n + ' VAGAS' : 'VAGA ABERTA'), bg: C.yellow, fg: C.ink });
    if (d.contrato) pills.push({ t: String(d.contrato).toUpperCase(), bg: C.blue, fg: C.white });
    items.push({ h: 58, w: 0, f: function (y) {
      var px = L;
      pills.forEach(function (p) {
        ctx.font = font(700, 25);
        var w = trackedWidth(ctx, p.t, 1.6) + 56;
        ctx.fillStyle = p.bg; rr(ctx, px, y, w, 58, 29); ctx.fill();
        ctx.fillStyle = p.fg; drawTracked(ctx, p.t, px + 28, y + 38, 1.6);
        px += w + 14;
      });
    }});

    var titleMax = story ? 82 : 76;
    function addTitle(max) {
      var t = fit(ctx, d.cargo || 'Título da vaga', CW, 3, 700, max, 44);
      return { h: t.lines.length * t.size * 1.12, w: 1.5, f: function (y) {
        ctx.fillStyle = C.ink;
        t.lines.forEach(function (ln, i) {
          ctx.font = font(700, t.size);
          ctx.fillText(ln, L, y + t.size * 0.82 + i * t.size * 1.12);
        });
      }};
    }
    items.push(addTitle(titleMax));

    if (d.empresa) items.push({ h: 44, w: 0.45, f: function (y) {
      ctx.font = font(500, 36); ctx.fillStyle = C.mute;
      ctx.fillText(clip1(ctx, d.empresa, CW), L, y + 32);
    }});

    items.push({ h: 2, w: 0.9, f: function (y) {
      ctx.fillStyle = C.line; ctx.fillRect(L, y, CW, 2);
    }});

    var rows = [];
    if (d.cidade) rows.push(['pin', 'LOCAL', d.cidade]);
    if (d.salario) rows.push(['money', 'SALÁRIO', d.salario]);
    if (d.horario) rows.push(['clock', 'HORÁRIO', d.horario]);
    rows.forEach(function (r, i) {
      items.push({ h: 68, w: i === 0 ? 0.9 : 0.32, row: true, f: function (y) {
        ctx.fillStyle = C.tint;
        ctx.beginPath(); ctx.arc(L + 34, y + 34, 34, 0, TAU); ctx.fill();
        ICONS[r[0]](ctx, L + 34, y + 34, 40);
        ctx.font = font(500, 21); ctx.fillStyle = C.mute;
        drawTracked(ctx, r[1], L + 92, y + 26, 2);
        ctx.font = font(700, 34); ctx.fillStyle = C.ink;
        ctx.fillText(clip1(ctx, r[2], CW - 92), L + 92, y + 62);
      }});
    });

    var reqs = (d.requisitos || []).filter(Boolean).slice(0, 5);
    var reqItems = [];
    if (reqs.length) {
      reqItems.push({ h: 26, w: 1.1, req: true, f: function (y) {
        ctx.font = font(700, 23); ctx.fillStyle = C.green;
        drawTracked(ctx, 'REQUISITOS', L, y + 20, 3);
      }});
      reqs.forEach(function (r, i) {
        ctx.font = font(500, 29);
        var lines = wrap(ctx, r, CW - 46).slice(0, 2);
        reqItems.push({ h: lines.length * 38, w: i === 0 ? 0.7 : 0.3, req: true, f: function (y) {
          ctx.fillStyle = C.yellow;
          ctx.beginPath(); ctx.arc(L + 9, y + 17, 9, 0, TAU); ctx.fill();
          ctx.fillStyle = C.ink; ctx.font = font(500, 29);
          lines.forEach(function (ln, j) { ctx.fillText(ln, L + 40, y + 26 + j * 38); });
        }});
      });
      items = items.concat(reqItems);
    }

    /* ----- ajusta para caber: solta espaço, depois corta ----- */
    function sums() {
      var h = 0, w = 0;
      items.forEach(function (it) { h += it.h; w += it.w; });
      return { h: h, w: w };
    }
    var s = sums();
    var guard = 0;
    while (s.h + s.w * 14 > avail && guard++ < 12) {
      var lastReq = -1;
      for (var i = items.length - 1; i >= 0; i--) if (items[i].req) { lastReq = i; break; }
      if (lastReq > 0 && items[lastReq].h > 26) { items.splice(lastReq, 1); }
      else if (lastReq >= 0) { items.splice(lastReq, 1); }
      else if (titleMax > 48) { titleMax -= 8; items[1] = addTitle(titleMax); }
      else if (rows.length && items.some(function (x) { return x.row; })) {
        for (var j = items.length - 1; j >= 0; j--) if (items[j].row) { items.splice(j, 1); break; }
      } else break;
      s = sums();
    }

    var unit = s.w > 0 ? (avail - s.h) / s.w : 0;
    unit = Math.max(13, Math.min(unit, 44));
    var used = s.h + s.w * unit;
    var y = top + Math.max(0, (avail - used) * 0.35);
    items.forEach(function (it) { y += it.w * unit; it.f(y); y += it.h; });

    /* ----- barra verde ----- */
    ctx.fillStyle = C.green; rr(ctx, L - 22, barY, CW + 44, barH, 30); ctx.fill();
    ctx.font = font(700, 22); ctx.fillStyle = C.yellow;
    drawTracked(ctx, 'COMO SE CANDIDATAR', L + 16, barY + 46, 3);
    ctx.fillStyle = C.white;
    cta.lines.forEach(function (ln, i) {
      ctx.font = font(700, cta.size);
      ctx.fillText(ln, L + 16, barY + 84 + i * (cta.size + 8));
    });

    if (story && d.rodape) {
      ctx.textAlign = 'center';
      ctx.font = font(500, 34); ctx.fillStyle = C.white;
      ctx.fillText(clip1(ctx, d.rodape, 900), 540, 1706);
      ctx.textAlign = 'left';
    }

    ctx.restore();
  }

  var API = { draw: draw, mark: mark, colors: C };
  if (typeof module !== 'undefined' && module.exports) module.exports = API;
  global.TRN = API;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
var $ = function (id) { return document.getElementById(id); };
var FIELDS = ['cargo','empresa','cidade','contrato','salario','horario','vagas','requisitos','candidatura','rodape'];

function dados() {
  var d = {};
  FIELDS.forEach(function (k) { d[k] = $(k).value.trim(); });
  d.requisitos = $('requisitos').value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
  return d;
}

function legenda(d) {
  var L = [];
  L.push('📢 VAGA DE EMPREGO — ' + (d.cargo || '').toUpperCase());
  if (d.empresa) L.push('🏢 ' + d.empresa);
  if (d.cidade) L.push('📍 ' + d.cidade);
  if (d.contrato) L.push('💼 ' + d.contrato + (parseInt(d.vagas,10) > 1 ? ' — ' + d.vagas + ' vagas' : ''));
  if (d.salario) L.push('💰 ' + d.salario);
  if (d.horario) L.push('⏰ ' + d.horario);
  if (d.requisitos.length) {
    L.push('', '✅ Requisitos:');
    d.requisitos.forEach(function (r) { L.push('• ' + r); });
  }
  if (d.candidatura) L.push('', '📩 ' + d.candidatura);
  var tag = (d.cidade || '').split('/')[0].trim().replace(/\s+/g, '');
  L.push('', '#TrabalhaRN #VagasRN #EmpregoRN #RioGrandeDoNorte' + (tag ? ' #' + tag : ''));
  return L.join('\n');
}

function render() {
  var d = dados();
  TRN.draw($('cPost').getContext('2d'), d, 'post');
  TRN.draw($('cStory').getContext('2d'), d, 'story');
  $('legenda').value = legenda(d);
}

function slug(s) {
  return (s || 'vaga').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'vaga';
}

function baixar(fmt) {
  var cv = fmt === 'post' ? $('cPost') : $('cStory');
  cv.toBlob(function (b) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'trabalharn-' + slug($('cargo').value) + '-' + fmt + '.png';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
  }, 'image/png');
}

function aba(fmt) {
  var p = fmt === 'post';
  $('cPost').style.display = p ? '' : 'none';
  $('cStory').style.display = p ? 'none' : '';
  $('tabPost').setAttribute('aria-selected', p);
  $('tabStory').setAttribute('aria-selected', !p);
}

FIELDS.forEach(function (k) { $(k).addEventListener('input', render); });
$('tabPost').onclick = function () { aba('post'); };
$('tabStory').onclick = function () { aba('story'); };
$('dlPost').onclick = function () { baixar('post'); };
$('dlStory').onclick = function () { baixar('story'); };
$('dlAmbos').onclick = function () { baixar('post'); setTimeout(function () { baixar('story'); }, 500); };
$('copiar').onclick = function () {
  var t = $('legenda'); t.select(); t.setSelectionRange(0, 99999);
  try { document.execCommand('copy'); } catch (e) {}
  if (navigator.clipboard) navigator.clipboard.writeText(t.value).catch(function(){});
  this.textContent = 'Legenda copiada!';
  var b = this; setTimeout(function () { b.textContent = 'Copiar legenda'; }, 1800);
};

(function () {
  var lg = $('logo').getContext('2d');
  function marca() { lg.clearRect(0, 0, 140, 140); TRN.mark(lg, 70, 70, 68); }
  marca(); render();
  if (document.fonts && document.fonts.load) {
    Promise.all([document.fonts.load('700 76px Poppins'), document.fonts.load('500 30px Poppins')])
      .then(function () { marca(); render(); });
  }
})();
</script>
</body>
